[project]
name = "capbench"
version = "0.1.0"
description = "Capacity-aware LLM routing benchmark: simulated serving limits over LLMRouterBench outcomes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
embed = ["sentence-transformers"]  # only needed when the embedding cache is cold
calibrate = ["httpx"]      # capbench.calibrate against a live vLLM server
dev = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
